<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-label="claude-clone - several Claude accounts side by side">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#141413"/>
      <stop offset="1" stop-color="#262421"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.78" cy="0.45" r="0.55">
      <stop offset="0" stop-color="#d97757" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#d97757" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#ffffff" fill-opacity="0.05"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#000" flood-opacity="0.45"/>
    </filter>
    <style>
      .t { font-family: 'Segoe UI', Inter, 'Helvetica Neue', Arial, sans-serif; }
      .m { font-family: 'Cascadia Code', 'JetBrains Mono', Consolas, 'Courier New', monospace; }
      .float1 { animation: float 6s ease-in-out infinite; }
      .float2 { animation: float 6s ease-in-out -2s infinite; }
      .float3 { animation: float 6s ease-in-out -4s infinite; }
      @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
      .pulse { animation: pulse 2.4s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
      @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }
      .caret { animation: blink 1.1s steps(1) infinite; }
      @keyframes blink { 0%, 50% { opacity: 1; } 50.01%, 100% { opacity: 0; } }
    </style>
  </defs>

  <rect width="1200" height="360" rx="20" fill="url(#bg)"/>
  <rect width="1200" height="360" rx="20" fill="url(#dots)"/>
  <rect width="1200" height="360" rx="20" fill="url(#glow)"/>

  <!-- left: title -->
  <g class="t">
    <text x="72" y="150" font-size="64" font-weight="700" fill="#faf9f5" letter-spacing="-1.5">claude-clone</text>
    <text x="74" y="196" font-size="22" fill="#c2c0b6">Several Claude accounts, side by side.</text>
    <text x="74" y="228" font-size="18" fill="#8f8d85">Claude Desktop and Claude Code - one profile per account.</text>
  </g>
  <g class="m" font-size="15">
    <rect x="72" y="262" width="372" height="40" rx="10" fill="#1f1e1d" stroke="#3a3833"/>
    <text x="90" y="287" fill="#8f8d85">&gt;</text>
    <text x="108" y="287" fill="#faf9f5">.\claude-clone.ps1</text>
    <rect class="caret" x="276" y="273" width="9" height="18" fill="#d97757"/>
    <text x="300" y="287" fill="#6b6964">Win · mac · Linux</text>
  </g>

  <!-- right: three account windows -->
  <g class="float3" filter="url(#shadow)">
    <g transform="translate(770 46)">
      <rect width="330" height="200" rx="14" fill="#2b2a27" stroke="#3d3b36"/>
      <rect width="330" height="34" rx="14" fill="#33312d"/>
      <rect y="20" width="330" height="14" fill="#33312d"/>
      <circle cx="20" cy="17" r="5" fill="#4a4843"/><circle cx="38" cy="17" r="5" fill="#4a4843"/><circle cx="56" cy="17" r="5" fill="#4a4843"/>
      <text class="t" x="314" y="22" font-size="13" fill="#8f8d85" text-anchor="end">client-a</text>
      <rect x="22" y="56" width="44" height="44" rx="11" fill="#6a9bcc"/>
      <text class="t" x="44" y="86" font-size="22" font-weight="700" fill="#141413" text-anchor="middle">C</text>
      <rect x="82" y="62" width="150" height="10" rx="5" fill="#4a4843"/>
      <rect x="82" y="82" width="104" height="10" rx="5" fill="#3d3b36"/>
      <rect x="22" y="122" width="286" height="10" rx="5" fill="#35332f"/>
      <rect x="22" y="142" width="240" height="10" rx="5" fill="#35332f"/>
    </g>
  </g>
  <g class="float2" filter="url(#shadow)">
    <g transform="translate(700 98)">
      <rect width="330" height="200" rx="14" fill="#2b2a27" stroke="#3d3b36"/>
      <rect width="330" height="34" rx="14" fill="#33312d"/>
      <rect y="20" width="330" height="14" fill="#33312d"/>
      <circle cx="20" cy="17" r="5" fill="#4a4843"/><circle cx="38" cy="17" r="5" fill="#4a4843"/><circle cx="56" cy="17" r="5" fill="#4a4843"/>
      <text class="t" x="314" y="22" font-size="13" fill="#8f8d85" text-anchor="end">personal</text>
      <rect x="22" y="56" width="44" height="44" rx="11" fill="#788c5d"/>
      <text class="t" x="44" y="86" font-size="22" font-weight="700" fill="#141413" text-anchor="middle">P</text>
      <rect x="82" y="62" width="150" height="10" rx="5" fill="#4a4843"/>
      <rect x="82" y="82" width="104" height="10" rx="5" fill="#3d3b36"/>
      <rect x="22" y="122" width="286" height="10" rx="5" fill="#35332f"/>
      <rect x="22" y="142" width="200" height="10" rx="5" fill="#35332f"/>
    </g>
  </g>
  <g class="float1" filter="url(#shadow)">
    <g transform="translate(630 150)">
      <rect width="330" height="200" rx="14" fill="#2b2a27" stroke="#d97757" stroke-opacity="0.7"/>
      <rect width="330" height="34" rx="14" fill="#33312d"/>
      <rect y="20" width="330" height="14" fill="#33312d"/>
      <circle cx="20" cy="17" r="5" fill="#4a4843"/><circle cx="38" cy="17" r="5" fill="#4a4843"/><circle cx="56" cy="17" r="5" fill="#4a4843"/>
      <text class="t" x="314" y="22" font-size="13" fill="#c2c0b6" text-anchor="end">work</text>
      <rect x="22" y="56" width="44" height="44" rx="11" fill="#d97757"/>
      <text class="t" x="44" y="86" font-size="22" font-weight="700" fill="#141413" text-anchor="middle">W</text>
      <rect x="82" y="62" width="150" height="10" rx="5" fill="#4a4843"/>
      <rect x="82" y="82" width="104" height="10" rx="5" fill="#3d3b36"/>
      <circle class="pulse" cx="300" cy="78" r="6" fill="#4ec27a"/>
      <rect x="22" y="122" width="286" height="10" rx="5" fill="#35332f"/>
      <rect x="22" y="142" width="250" height="10" rx="5" fill="#35332f"/>
      <rect x="22" y="162" width="180" height="10" rx="5" fill="#35332f"/>
    </g>
  </g>
</svg>
